[package]
name = "xiaomi-odin-firmware-util"
version = "0.1.0"
edition = "2021"
description = "Firmware extractor, NV MAC/BD_ADDR provisioner, and hardware status CLI for Xiaomi MIX 4 (xiaomi-odin, SM8350)"
license = "GPL-3.0-or-later"
repository = "https://github.com/prenaissance/xiaomi-odin-firmware-util"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
